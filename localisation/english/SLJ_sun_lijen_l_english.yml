l_english:
 ### Character / party / trait ###
 SLJ_party:0 "NRA Council"
 SLJ_party_long:0 "National Revolutionary Army Reform Council"
 SLJ_the_soldiers_general:0 "The Soldier's General"
 SLJ_the_soldiers_general_desc:0 "A Virginia Military Institute graduate who trusts drill, discipline and merit far more than party slogans."

 ### Focuses ###
 SLJ_the_officers_memorandum:0 "The Officers' Memorandum"
 SLJ_the_officers_memorandum_desc:0 "As the secret police tighten their grip, a circle of foreign-trained officers led by Colonel Sun Li-jen of the Tax Police has submitted a memorandum: China will not be saved by informants and purges, but by a professional army. The Generalissimo has not answered. Some say he never will."
 SLJ_court_the_moderates:0 "Court the Moderates"
 SLJ_court_the_moderates_desc:0 "Liberal academics, Shanghai bankers and the party's quieter elders have no love for the Blueshirts. Quiet meetings with them could give the reformers a political base outside the barracks."
 SLJ_a_hero_of_the_nation:0 "A Hero of the Nation"
 SLJ_a_hero_of_the_nation_desc:0 "Newspapers sympathetic to reform have begun printing stories of Sun's disciplined regiments. A nation tired of defeat wants a soldier it can believe in."
 SLJ_the_tax_police_model:0 "The Tax Police Model"
 SLJ_the_tax_police_model_desc:0 "The Ministry of Finance's Tax Police are the best-drilled troops in China: well paid, well fed and promoted on merit. Their training methods should be spread to the wider army."
 SLJ_american_methods:0 "American Methods"
 SLJ_american_methods_desc:0 "Sun learned soldiering in Lexington, Virginia. With the right contacts in Washington, American instructors and doctrine could reshape the officer corps."
 SLJ_the_generalissimo_steps_aside:0 "The Generalissimo Steps Aside"
 SLJ_the_generalissimo_steps_aside_desc:0 "With the public, the army and the moderates behind him, Sun can ask for power rather than seize it. Chiang may yet accept an honorable retirement as the elder statesman of the revolution."
 SLJ_the_nanking_coup:0 "The Nanking Coup"
 SLJ_the_nanking_coup_desc:0 "There is no more time for petitions. Loyal regiments will secure the capital overnight. Chiang's loyalists will not accept it, and China will bleed once more, but what survives will be disciplined."
 SLJ_the_new_army:0 "The New Army"
 SLJ_the_new_army_desc:0 "Fewer divisions, better men. Militia and paper formations are dissolved, and every remaining soldier is trained, equipped and led by officers who earned their rank."
 SLJ_special_service_units:0 "Special Service Units"
 SLJ_special_service_units_desc:0 "Small, hand-picked units trained for raids, infiltration and jungle warfare, the sharpest edge of the new army."
 SLJ_discipline_over_chaos:0 "Discipline over Chaos"
 SLJ_discipline_over_chaos_desc:0 "Warlords, secret police and corruption once defined Chinese politics. The new order promises something simpler: rules that apply to everyone, from private to president."
  SLJ_no_foreign_war_tt:0 "Not at war with a foreign major power"

 ### Ideas ###
 SLJ_officers_disquiet:0 "Disquiet in the Officer Corps"
 SLJ_officers_disquiet_desc:0 "The army's reformers and the regime's security men are openly at odds. Until the matter is settled, the government is divided against itself."
 SLJ_professional_army_1:0 "Professional Training"
 SLJ_professional_army_1_desc:0 "Tax Police drill manuals are being adopted across the army."
 SLJ_professional_army_2:0 "The New Army"
 SLJ_professional_army_2_desc:0 "A smaller army of trained regulars led by a merit-based officer corps."
 SLJ_professional_army_3:0 "The New Army (Forged in Civil War)"
 SLJ_professional_army_3_desc:0 "Tested against its own countrymen, the reformed army is smaller, harder and utterly loyal to its commanders."
 SLJ_special_service_units_idea:0 "Special Service Units"
 SLJ_special_service_units_idea_desc:0 "Elite raiders and jungle fighters."

 ### Decisions ###
 SLJ_officer_corps_category:0 "The Officer Corps"
 SLJ_officer_corps_category_desc:0 "Sun Li-jen's reformers need public support, liberal allies and a reputation to match their ambitions."
 SLJ_reach_out_to_the_liberals:0 "Reach Out to the Liberals"
 SLJ_reach_out_to_the_liberals_desc:0 "Promise moderates a constitution once the nation is secure."
 SLJ_promote_the_war_hero:0 "Promote the War Hero"
 SLJ_promote_the_war_hero_desc:0 "Make Sun Li-jen's name known in every province."
 SLJ_decision_cost_CP_15:0 "£command_power  §Y15§!"
 SLJ_sway_the_mps:0 "Sway the Military Police"
 SLJ_sway_the_mps_desc:0 "Attempt to sway the ROCMP to our side."

 ### Tooltips ###
 SLJ_unlocks_officer_corps_decisions_tt:0 "Unlocks the §YOfficer Corps§! decision category."
 SLJ_unlocks_liberals_decision_tt:0 "Unlocks the decision §YReach Out to the Liberals§!."
