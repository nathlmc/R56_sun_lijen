l_english:
 ### Character / party / trait ###
 SLJ_party:0 "NRA Council"
 SLJ_party_long:0 "National Revolutionary Army Reform Council"
 SLJ_the_soldiers_general:0 "The Soldier's General"
 SLJ_the_soldiers_general_desc:0 "A Virginia Military Institute graduate who trusts drill, discipline and merit far more than party slogans."

 ### Focuses ###
 SLJ_the_officers_memorandum:0 "The Officers' Memorandum"
 SLJ_the_officers_memorandum_desc:0 "As the secret police tighten their grip, a circle of foreign-trained officers led by Colonel Sun Li-jen of the Tax Police has submitted a memorandum: China will not be saved by informants and purges, but by a professional army. The Generalissimo has not answered. Some say he never will."
 SLJ_court_the_moderates:0 "Court the Moderates"
 SLJ_court_the_moderates_desc:0 "Liberal academics, Shanghai bankers and the party's quieter elders have no love for the Blueshirts. Quiet meetings with them could give the reformers a political base outside the barracks."
 SLJ_a_hero_of_the_nation:0 "A Hero of the Nation"
 SLJ_a_hero_of_the_nation_desc:0 "Newspapers sympathetic to reform have begun printing stories of Sun's disciplined regiments. A nation tired of defeat wants a soldier it can believe in."
 SLJ_the_tax_police_model:0 "The Tax Police Model"
 SLJ_the_tax_police_model_desc:0 "The Ministry of Finance's Tax Police are the best-drilled troops in China: well paid, well fed and promoted on merit. Their training methods should be spread to the wider army."
 SLJ_american_methods:0 "American Methods"
 SLJ_american_methods_desc:0 "Sun learned soldiering in Lexington, Virginia. With the right contacts in Washington, American instructors and doctrine could reshape the officer corps."
 SLJ_the_generalissimo_steps_aside:0 "The Generalissimo Steps Aside"
 SLJ_the_generalissimo_steps_aside_desc:0 "With the public, the army and the moderates behind him, Sun can ask for power rather than seize it. Chiang may yet accept an honorable retirement as the elder statesman of the revolution."
 SLJ_the_nanking_coup:0 "The Nanking Coup"
 SLJ_the_nanking_coup_desc:0 "There is no more time for petitions. Loyal regiments will secure the capital overnight. Chiang's loyalists will not accept it, and China will bleed once more, but what survives will be disciplined."
 SLJ_the_new_army:0 "The New Army"
 SLJ_the_new_army_desc:0 "Fewer divisions, better men. Militia and paper formations are dissolved, and every remaining soldier is trained, equipped and led by officers who earned their rank."
 SLJ_special_service_units:0 "Special Service Units"
 SLJ_special_service_units_desc:0 "Small, hand-picked units trained for raids, infiltration and jungle warfare, the sharpest edge of the new army."
 SLJ_discipline_over_chaos:0 "Discipline over Chaos"
 SLJ_discipline_over_chaos_desc:0 "Warlords, secret police and corruption once defined Chinese politics. The new order promises something simpler: rules that apply to everyone, from private to president."
  SLJ_no_foreign_war_tt:0 "Not at war with a foreign major power"

 ### Ideas ###
 SLJ_officers_disquiet:0 "Disquiet in the Officer Corps"
 SLJ_officers_disquiet_desc:0 "The army's reformers and the regime's security men are openly at odds. Until the matter is settled, the government is divided against itself."
 SLJ_professional_army_1:0 "Professional Training"
 SLJ_professional_army_1_desc:0 "Tax Police drill manuals are being adopted across the army."
 SLJ_professional_army_2:0 "The New Army"
 SLJ_professional_army_2_desc:0 "A smaller army of trained regulars led by a merit-based officer corps."
 SLJ_professional_army_3:0 "The New Army (Forged in Civil War)"
 SLJ_professional_army_3_desc:0 "Tested against its own countrymen, the reformed army is smaller, harder and utterly loyal to its commanders."
 SLJ_special_service_units_idea:0 "Special Service Units"
 SLJ_special_service_units_idea_desc:0 "Elite raiders and jungle fighters."

 ### Decisions ###
 SLJ_officer_corps_category:0 "The Officer Corps"
 SLJ_officer_corps_category_desc:0 "Sun Li-jen's reformers need public support, liberal allies and a reputation to match their ambitions."
 SLJ_reach_out_to_the_liberals:0 "Reach Out to the Liberals"
 SLJ_reach_out_to_the_liberals_desc:0 "Promise moderates a constitution once the nation is secure."
 SLJ_promote_the_war_hero:0 "Promote the War Hero"
 SLJ_promote_the_war_hero_desc:0 "Make Sun Li-jen's name known in every province."
 SLJ_sway_the_mps:0 "Sway the Military Police"
 SLJ_sway_the_mps_desc:0 "Attempt to sway the ROCMP to our side."
 SLJ_sway_the_airforce:0 "Sway the Air Force"
 SLJ_sway_the_airforce_desc:0 "Attempt to sway the ROCAF to our side."
 SLJ_sway_the_navy:0 "Sway the Navy"
 SLJ_sway_the_navy_desc:0 "Attempt to sway the ROCN to our side."

 ### Tooltips ###
 SLJ_unlocks_officer_corps_decisions_tt:0 "Unlocks the §YOfficer Corps§! decision category."
 SLJ_unlocks_liberals_decision_tt:0 "Unlocks the decision §YReach Out to the Liberals§!."
 SLJ_unlocks_war_hero_decision_tt:0 "Unlocks the decision §YPromote the War Hero§!."
 SLJ_ask_usa_for_advisors_tt:0 "§YThe United States§! will be asked to send military advisors."
 SLJ_coup_warning_tt:0 "If the armed forces are divided, §Rcivil war will follow§!. The more branches back Sun, the smaller the loyalist revolt."
 SLJ_war_hero_condition_tt:0 "Sun Li-jen is a recognized war hero (§YPromote the War Hero§! taken, or his skill is above 3)"
 SLJ_american_advisors:0 "American Advisors"
 SLJ_mps_will_join_tt:0 "§YThe Military Police§! will side with Sun when the time comes."
 SLJ_airforce_will_join_tt:0 "§BThe Air Force§! will side with Sun when the time comes."
 SLJ_navy_will_join_tt:0 "§WThe Navy§! will side with Sun when the time comes."

 ### Events ###
 slj.1.t:0 "The Officers' Memorandum"
 slj.1.d:0 "The document is only four pages long, but it carries the signatures of more than forty field officers. It calls for an end to political commissars in the ranks, promotion by examination, and a military budget audited by the Ministry of Finance. At the top of the list is a name the Generalissimo knows well: Sun Li-jen."
 slj.1.a:0 "Let them speak. China needs soldiers like these."
 slj.1.b:0 "Note the names. Quietly."
 slj.2.t:0 "The Generalissimo Steps Aside"
 slj.2.d:0 "In a short radio address, Chiang Kai-shek announced that, \"for the good of the nation in its hour of danger\", he would hand the leadership of the government to General Sun Li-jen and serve the revolution as an elder statesman. The capital is calm. Most of the army has declared its support."
 slj.2.a:0 "A new chapter."
 slj.3.t:0 "The Nanking Coup"
 slj.3.d:0 "At dawn, Tax Police regiments occupied the Executive Yuan, the radio station and the city gates. By noon, General Sun Li-jen had declared a Government of National Reform. Chiang Kai-shek escaped the capital, and loyalist commanders across the interior have already denounced the 'traitor of Nanking'. China is at war with itself."
 slj.3.a:0 "There is no turning back."
 slj.13.t:0 "Nanking Changes Hands Overnight"
 slj.13.d:0 "At 23:00 last night, a convoy of Military Police vehicles entered the Nanking Presidential Palace. The sentries did not even attempt to stop them. As they stopped in front of the main building, a tall, athletic figure stepped out of the middle vehicle. Surrounded by a dozen soldiers, he hurried into the building.\n\"This is treason, General Sun!\" yelled Chiang. \n\"Generalissimo, the people have spoken, I have the support of the armed forces, any further resistance would be futile!\" replied Sun coldly.\nFor years, he had seen the corruption and excesses of the Chiang regime. The day has finally come for the Republic of China to step into a new chapter."
 slj.13.a:0 "The end of the Generalissimo's rule."
 slj.4.t:0 "Chinese Request for Military Advisors"
 slj.4.d:0 "A delegation of Chinese officers, led by a graduate of the Virginia Military Institute, has asked the War Department to send instructors to help modernize their army."
 slj.4.a:0 "Send the advisors."
 slj.4.b:0 "We cannot get involved."
 slj.5.t:0 "The Americans Arrive"
 slj.5.d:0 "A small mission of American officers has arrived and begun work with our training divisions. Their methods are already making a difference."
 slj.5.a:0 "Excellent."
 slj.6.t:0 "Washington Declines"
 slj.6.d:0 "The Americans have politely declined our request. We will have to adapt their manuals on our own."
 slj.6.a:0 "We will manage."
 slj.7.t:0 "Rumors of conspiracy with the Military Police"
 slj.7.d:0 "Rumors are spreading of secret meetings between Sun and the Military Police. Known for their \"Chung Chen Chün Feng\", it is hard to imagine these units turning on the Generalissimo, whose regime they are sworn to protect."
 slj.7.a:0 "We'll try again"
 slj.8.t:0 "A Secret Channel"
 slj.8.d:0 "A secret backchannel has been established between Sun and the Military Police. Despite being known for their \"Chung Chen Chün Feng\", it seems that trust has been established between Sun and Military Police high command."
 slj.8.a:0 "The xiezhi stands on our side."
 slj.9.t:0 "Sun Spotted Leaving Air Force Base"
 slj.9.d:0 "General Sun Li-jen was spotted, looking frustrated, leaving an Air Force base in the middle of the night. Hours earlier, several high ranking Air Force officers were seen entering the base. The \"Chung Yung Chün Feng\" branch of the armed forces could be a deciding force in a conflict in China."
 slj.9.a:0 "We'll try again"
 slj.10.t:0 "CBIS Officers Refused Entry Onto Air Force Base"
 slj.10.d:0 "Following on a tip, CBIS attempted to enter an Air Force Base near Nanking, looking to investigate rumors of a coup. If the rumors are true, the loss of loyalty from the \"Chung Yung Chün Feng\" branch of the armed forces would be a large blow on the current government."
 slj.10.a:0 "We control the air."
 slj.11.t:0 "Small Skirmish at Qingdao Naval Base"
 slj.11.d:0 "Sounds of gunfire rang out at the entrance gate of Qingdao Naval Base. Witnesses reported a car reportedly carrying General Sun Li-jen rushing out of the base, seconds before CBIS agents could form a barricade and arrest him. Pressed for answers, the Central Government explained it as a training exercise."
 slj.11.a:0 "We'll try again"
 slj.12.t:0 "Increased Activities at Naval Bases"
 slj.12.d:0 "Witnesses spotted increased security and drills at bases of The New Navy. Despite its young age, the \"Chung I Chün Feng\" branch is quite capable in aiding and blocking troop movements on China's waters."
 slj.12.a:0 "Anchors Aweigh!"